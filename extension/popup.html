<!doctype html><html><head><meta charset="utf-8"><title>Margin</title>
<style>
body{font:13px/1.45 system-ui,sans-serif;width:300px;margin:0;padding:14px;color:#203c39;background:#f8f8f3}
h1{font:18px Georgia,serif;margin:0 0 8px}
#state{margin:0 0 10px;padding:8px 10px;border-radius:8px;background:#eef3ea}
#state.bad{background:#fbeee4}
input{width:100%;box-sizing:border-box;padding:6px 8px;border:1px solid #c8d3c6;border-radius:6px;margin:4px 0 6px}
button{border:1px solid #c8d3c6;background:#fff;border-radius:7px;padding:7px 10px;cursor:pointer;color:#244b44}
button.primary{background:#315e4e;color:#fff;border:0;width:100%}
small{color:#6f8b74}
#msg{min-height:18px;margin-top:8px}
</style></head><body>
<h1>Margin</h1>
<p id="state">Looking for Margin…</p>
<div id="pair" hidden><small>Paste the pairing code from Margin → Settings → Browser extension.</small><input id="code" placeholder="Pairing code" autocomplete="off"><button id="save">Pair</button></div>
<button id="send" class="primary" hidden>Send this page's PDF to Margin</button>
<p id="msg"></p>
<small>When you click “Add to project” in Margin, the paper opens here; sign in if asked and the PDF is sent to Margin automatically.</small>
<script src="popup.js"></script>
</body></html>
